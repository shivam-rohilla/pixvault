{% extends 'base.html' %}
{% block title %}Create Account — Pixvault{% endblock %}

{% block content %}
<div class="min-h-[90vh] flex items-center justify-center px-4 py-16">
  <div class="w-full max-w-[420px]">

    <!-- Logo -->
    <div class="text-center mb-8">
      <a href="{{ url_for('media.index') }}" class="inline-flex items-center gap-2 mb-4">
        <div class="w-10 h-10 bg-[#0071E3] rounded-2xl flex items-center justify-center shadow">
          <svg width="20" height="20" viewBox="0 0 16 16" fill="none">
            <rect x="1" y="1" width="6" height="6" rx="1.5" fill="white"/>
            <rect x="9" y="1" width="6" height="6" rx="1.5" fill="white" opacity=".7"/>
            <rect x="1" y="9" width="6" height="6" rx="1.5" fill="white" opacity=".7"/>
            <rect x="9" y="9" width="6" height="6" rx="1.5" fill="white" opacity=".4"/>
          </svg>
        </div>
      </a>
      <h1 class="text-2xl font-bold tracking-tight">Create your gallery</h1>
      <p class="text-[#6E6E73] text-sm mt-1">Free forever. No credit card needed.</p>
    </div>

    <!-- Card -->
    <div class="bg-white rounded-[22px] shadow-lg border border-[#D2D2D7]/30 p-8">
      <form method="POST" action="{{ url_for('auth.register') }}" class="flex flex-col gap-4">

        <div>
          <label class="block text-sm font-medium mb-1.5">Username</label>
          <input type="text" name="username" required autocomplete="username"
                 placeholder="yourname" minlength="3" maxlength="30"
                 pattern="[a-zA-Z0-9_]+"
                 title="Letters, numbers, and underscores only"
                 class="input-field"
                 value="{{ request.form.get('username', '') }}">
          <p class="text-xs text-[#6E6E73] mt-1">Your public URL: pixvault.app/u/<span id="un-preview" class="font-medium">yourname</span></p>
        </div>

        <div>
          <label class="block text-sm font-medium mb-1.5">Email</label>
          <input type="email" name="email" required autocomplete="email"
                 placeholder="you@example.com"
                 class="input-field"
                 value="{{ request.form.get('email', '') }}">
        </div>

        <div>
          <label class="block text-sm font-medium mb-1.5">Password</label>
          <input type="password" name="password" required autocomplete="new-password"
                 placeholder="At least 6 characters" minlength="6"
                 class="input-field">
        </div>

        <button type="submit" class="btn-primary w-full justify-center py-3 text-[15px] mt-1">
          Create Account
        </button>
      </form>
    </div>

    <p class="text-center text-sm text-[#6E6E73] mt-6">
      Already have an account?
      <a href="{{ url_for('auth.login') }}" class="text-[#0071E3] font-medium hover:underline">Sign in</a>
    </p>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script>
  // Live username preview
  const input = document.querySelector('input[name=username]');
  const preview = document.getElementById('un-preview');
  if (input && preview) {
    input.addEventListener('input', () => { preview.textContent = input.value || 'yourname'; });
  }
</script>
{% endblock %}
